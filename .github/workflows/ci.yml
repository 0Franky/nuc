name: Nexus Continuity Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-rust-core:
    name: Rust Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Run Cargo Tests (All Workspace Crates)
        run: cargo test --workspace --verbose

      - name: Build Release Binaries
        run: cargo build --workspace --release

  test-flutter-ui:
    name: Flutter UI Client Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.2'
          cache: true

      - name: Setup Rust for the Linux bundle
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build and isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libayatana-appindicator3-dev libx11-dev libxtst-dev libxkbcommon-dev libwayland-dev libssl-dev xvfb xdotool dbus-x11

      - name: Build complete Linux bundle
        run: bash scripts/build_linux.sh

      - name: Install Dependencies
        working-directory: ./apps/nexus_ui
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: ./apps/nexus_ui
        run: flutter analyze

      - name: Run Widget Tests
        working-directory: ./apps/nexus_ui
        env:
          XDG_SESSION_TYPE: x11
          WAYLAND_DISPLAY: ''
          NEXUS_INPUT_TEST_ENGINE: ${{ github.workspace }}/dist/linux/input-engine
          NEXUS_INPUT_TEST_WORK: ${{ runner.temp }}
          NEXUS_INPUT_TEST_EXPECT_CAPTURE: disabled
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          xvfb-run -a dbus-run-session -- flutter test --concurrency=1

      - name: Verify Linux bundle and backend lifecycle
        run: xvfb-run -a dbus-run-session -- bash scripts/check_linux_bundle.sh
